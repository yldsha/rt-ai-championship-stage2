[theme]
# Принудительно фиксируем светлую тему — иначе Streamlit подстраивается
# под системную тему пользователя (тёмная/светлая), из-за чего интерфейс
# может выглядеть по-разному 
base = "light"

primaryColor = "#1B4D3E"

backgroundColor = "#EAF6F4"
secondaryBackgroundColor = "#FFFFFF"

textColor = "#1a1a1a"

font = "sans serif"

[server]

fileWatcherType = "none"