name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff  # Добавляем линтер

      - name: Lint with Ruff
        run: ruff check .  # Запускаем проверку всего проекта

      - name: Check score.py runs
        run: python score.py --help